<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opciones Hero — Adrián Morales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:          #0d1117;
      --bg-card:     #161b22;
      --border:      #30363d;
      --accent:      #58a6ff;
      --accent-dim:  #1f6feb;
      --green:       #3fb950;
      --amber:       #d29922;
      --text:        #e6edf3;
      --text-muted:  #8b949e;
      --text-dim:    #6e7681;
    }
    html, body { margin: 0; background: #0a0d12; color: var(--text); font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* shared hero shell */
    .hero {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      display: flex;
      align-items: center;
      padding: 0 64px;
    }
    .hero-inner {
      position: relative;
      z-index: 5;
      display: flex;
      gap: 48px;
      align-items: center;
      width: 100%;
    }
    .hero-text { flex: 1; min-width: 0; }
    .h-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent); margin-bottom: 12px; letter-spacing: 0.08em; }
    .h-name    { font-size: 46px; font-weight: 700; line-height: 1.1; margin: 0 0 8px; }
    .h-title   { font-size: 17px; color: var(--text-muted); margin: 0 0 18px; }
    .h-bio     { font-size: 13px; color: var(--text-muted); max-width: 420px; margin: 0 0 22px; line-height: 1.6; }
    .h-actions { display: flex; gap: 12px; }
    .h-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px; border-radius: 8px;
      font-size: 13px; font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .h-btn.primary { background: var(--accent); color: #0d1117; }
    .h-btn.outline { background: transparent; border-color: var(--border); color: var(--text); }

    .opt-tag {
      position: absolute;
      top: 14px; left: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      z-index: 20;
      background: rgba(13,17,23,0.7);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    /* ============================================================
       ── OPTION A · BRAZO ROBÓTICO ──
    ============================================================ */
    .optA { background: #0b1018; }
    .optA::before {
      /* subtle dot grid */
      content: '';
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(88,166,255,0.08) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    }
    .robot-arm {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .arm-svg { width: 100%; height: 100%; overflow: visible; }

    /* ceiling mount + base */
    .arm-mount   { fill: #1c2230; stroke: var(--border); stroke-width: 1; }
    .arm-mount-2 { fill: #2a3140; stroke: var(--border); stroke-width: 1; }

    /* links (the rigid segments between joints) */
    .arm-link {
      fill: #1c2230;
      stroke: var(--accent);
      stroke-width: 1.4;
    }
    .arm-link-inner {
      fill: none;
      stroke: rgba(88,166,255,0.25);
      stroke-width: 1;
      stroke-dasharray: 3 4;
    }

    /* servos at each joint (drawn at local 0,0 inside rotating group) */
    .servo-body { fill: #161b22; stroke: var(--accent); stroke-width: 1.4; }
    .servo-cap  { fill: var(--accent); }
    .servo-hole { fill: var(--bg); }

    /* gripper / end effector */
    .arm-tool   { fill: var(--accent); }
    .arm-tool-2 { fill: #1c2230; stroke: var(--accent); stroke-width: 1.2; }

    /* LED indicator */
    .arm-led { fill: #ff5f87; animation: ledPulse 1.2s ease-in-out infinite; }
    @keyframes ledPulse {
      0%, 100% { opacity: 0.5; filter: drop-shadow(0 0 2px #ff5f87); }
      50%      { opacity: 1;   filter: drop-shadow(0 0 6px #ff5f87); }
    }

    /* cable detail */
    .arm-cable {
      fill: none;
      stroke: var(--text-dim);
      stroke-width: 1;
      stroke-dasharray: 2 3;
      opacity: 0.5;
    }

    /* avatar with hex frame (option A) */
    .av-A {
      position: relative;
      width: 200px; height: 200px;
      flex-shrink: 0;
      z-index: 4;
    }
    .av-A .img {
      width: 100%; height: 100%;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background: #1c2230 center/cover no-repeat;
    }
    .av-A .hex-border {
      position: absolute; inset: -8px;
      pointer-events: none;
    }
    .av-A .hex-border svg { width: 100%; height: 100%; overflow: visible; }
    .av-A .hex-border polygon {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.5;
      stroke-dasharray: 6 6;
      animation: rotateSlow 24s linear infinite;
      transform-origin: center;
    }
    @keyframes rotateSlow { to { transform: rotate(360deg); } }
    .av-A .corner {
      position: absolute;
      width: 14px; height: 14px;
      border: 2px solid var(--accent);
    }
    .av-A .corner.tl { top: -14px; left: 40px; border-right: 0; border-bottom: 0; }
    .av-A .corner.tr { top: -14px; right: 40px; border-left: 0; border-bottom: 0; }
    .av-A .corner.bl { bottom: -14px; left: 40px; border-right: 0; border-top: 0; }
    .av-A .corner.br { bottom: -14px; right: 40px; border-left: 0; border-top: 0; }

    /* ============================================================
       ── OPTION B · PCB / PLACA ──
    ============================================================ */
    .optB { background: #07120c; }
    .pcb-bg {
      position: absolute; inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .pcb-svg { width: 100%; height: 100%; }
    .pcb-trace {
      fill: none;
      stroke: rgba(63,185,80,0.35);
      stroke-width: 1.2;
    }
    .pcb-trace.lit {
      stroke: var(--green);
      stroke-width: 1.6;
      filter: drop-shadow(0 0 4px rgba(63,185,80,0.7));
      stroke-dasharray: 12 200;
      animation: pcbFlow 4s linear infinite;
    }
    .pcb-trace.lit-2 { animation-duration: 6s; animation-delay: -1s; }
    .pcb-trace.lit-3 { animation-duration: 5s; animation-delay: -2.5s; }
    .pcb-trace.lit-4 { animation-duration: 7s; animation-delay: -3.5s; }
    @keyframes pcbFlow { to { stroke-dashoffset: -212; } }
    .pcb-pad { fill: var(--green); }
    .pcb-pad.pulse { animation: padPulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pcb-pad.pulse:nth-child(odd) { animation-delay: -0.6s; }
    .pcb-pad.pulse:nth-child(3n)  { animation-delay: -1.2s; }
    @keyframes padPulse {
      0%,100% { opacity: 0.4; }
      50%     { opacity: 1; filter: drop-shadow(0 0 6px var(--green)); }
    }
    .pcb-via { fill: #161b22; stroke: var(--green); stroke-width: 1; }

    /* override accent for B */
    .optB .h-eyebrow { color: var(--green); }
    .optB .h-btn.primary { background: var(--green); color: #0a0d12; }

    /* avatar IC-chip frame */
    .av-B {
      position: relative;
      width: 200px; height: 200px;
      flex-shrink: 0;
      z-index: 4;
    }
    .av-B .img {
      width: 100%; height: 100%;
      border-radius: 6px;
      background: #1c2230 center/cover no-repeat;
      border: 2px solid var(--green);
      box-shadow: 0 0 30px rgba(63,185,80,0.25);
    }
    .av-B .pin {
      position: absolute;
      width: 6px; height: 12px;
      background: var(--green);
      box-shadow: 0 0 6px rgba(63,185,80,0.6);
    }
    .av-B .pin.top    { top: -12px; }
    .av-B .pin.bottom { bottom: -12px; }
    .av-B .pin.left   { left: -12px; width: 12px; height: 6px; }
    .av-B .pin.right  { right: -12px; width: 12px; height: 6px; }
    .av-B .pin-label {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--green);
      opacity: 0.7;
    }

    /* ============================================================
       ── OPTION C · HUD / BLUEPRINT ──
    ============================================================ */
    .optC { background: #060d1a; }
    .hud-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(88,166,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(88,166,255,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at center, #000 40%, transparent 90%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 40%, transparent 90%);
      z-index: 1;
    }
    .hud-corners {
      position: absolute; inset: 24px;
      pointer-events: none;
      z-index: 2;
    }
    .hud-corners::before, .hud-corners::after,
    .hud-corner-bl, .hud-corner-br {
      content: '';
      position: absolute;
      width: 40px; height: 40px;
      border: 1.5px solid var(--accent);
    }
    .hud-corners::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
    .hud-corners::after  { top: 0; right: 0; border-left: 0; border-bottom: 0; }
    .hud-corner-bl { bottom: 0; left: 0; border-right: 0; border-top: 0; }
    .hud-corner-br { bottom: 0; right: 0; border-left: 0; border-top: 0; }

    .hud-scanline {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 3;
    }
    .hud-scanline::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: scan 4s linear infinite;
      box-shadow: 0 0 12px var(--accent);
      opacity: 0.6;
    }
    @keyframes scan {
      0%   { top: 0%;   }
      100% { top: 100%; }
    }
    .hud-readout {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--accent);
      z-index: 4;
      opacity: 0.7;
    }
    .hud-readout.tl { top: 30px; left: 80px; }
    .hud-readout.tr { top: 30px; right: 80px; text-align: right; }
    .hud-readout.bl { bottom: 30px; left: 80px; }
    .hud-readout.br { bottom: 30px; right: 80px; text-align: right; }
    .hud-readout .blink { animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* avatar with targeting reticle */
    .av-C {
      position: relative;
      width: 200px; height: 200px;
      flex-shrink: 0;
      z-index: 4;
    }
    .av-C .img {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: #1c2230 center/cover no-repeat;
      border: 1px solid var(--accent);
    }
    .av-C .reticle {
      position: absolute; inset: -22px;
      pointer-events: none;
    }
    .av-C .reticle::before, .av-C .reticle::after {
      content: '';
      position: absolute;
      background: var(--accent);
    }
    .av-C .reticle::before { left: 50%; top: -8px; width: 1px; height: 14px; transform: translateX(-50%); }
    .av-C .reticle::after  { left: 50%; bottom: -8px; width: 1px; height: 14px; transform: translateX(-50%); }
    .av-C .reticle .h1 { position: absolute; top: 50%; left: -8px;  width: 14px; height: 1px; background: var(--accent); }
    .av-C .reticle .h2 { position: absolute; top: 50%; right: -8px; width: 14px; height: 1px; background: var(--accent); }
    .av-C .ring-rot {
      position: absolute; inset: -10px;
      border-radius: 50%;
      border: 1px dashed var(--accent);
      opacity: 0.5;
      animation: rotateSlow 18s linear infinite;
    }
    .av-C .arc {
      position: absolute; inset: -28px;
      border-radius: 50%;
      border: 1px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent);
      animation: rotateSlow 8s linear infinite reverse;
    }

    /* ============================================================
       ── OPTION D · OSCILOSCOPIO ──
    ============================================================ */
    .optD { background: #050a0d; }
    .scope-bg {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(63,185,80,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(63,185,80,0.06) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 1;
    }
    .scope-vignette {
      position: absolute; inset: 0;
      box-shadow: inset 0 0 120px rgba(0,0,0,0.7);
      z-index: 2;
      pointer-events: none;
    }
    .scope-waves {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .scope-svg { width: 100%; height: 100%; overflow: visible; }
    .scope-wave {
      fill: none;
      stroke-width: 1.8;
      filter: drop-shadow(0 0 6px currentColor);
    }
    .scope-wave.w1 { color: var(--green);  stroke: currentColor; opacity: 0.85; animation: sineMove 6s linear infinite; }
    .scope-wave.w2 { color: var(--accent); stroke: currentColor; opacity: 0.55; animation: sineMove 8s linear infinite reverse; }
    .scope-wave.w3 { color: var(--amber);  stroke: currentColor; opacity: 0.4;  animation: sineMove 10s linear infinite; }
    @keyframes sineMove { to { transform: translateX(-200px); } }

    .scope-readout {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--green);
      z-index: 5;
      opacity: 0.7;
    }
    .scope-readout.tl { top: 16px; left: 80px; }
    .scope-readout.tr { top: 16px; right: 80px; }
    .scope-readout.bl { bottom: 16px; left: 80px; }

    .optD .h-eyebrow { color: var(--green); }
    .optD .h-btn.primary { background: var(--green); color: #0a0d12; }

    .av-D {
      position: relative;
      width: 200px; height: 200px;
      flex-shrink: 0;
      z-index: 4;
    }
    .av-D .img {
      width: 100%; height: 100%;
      background: #1c2230 center/cover no-repeat;
      border: 1px solid var(--green);
      box-shadow: inset 0 0 30px rgba(63,185,80,0.15), 0 0 30px rgba(63,185,80,0.2);
    }
    .av-D .scan-line {
      position: absolute; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
      opacity: 0.7;
      animation: avScan 3s linear infinite;
    }
    @keyframes avScan { 0% { top: 0%; } 100% { top: 100%; } }
    .av-D .tick {
      position: absolute;
      background: var(--green);
    }
    .av-D .tick.t1 { top: -6px; left: 10%; width: 1px; height: 6px; }
    .av-D .tick.t2 { top: -6px; left: 50%; width: 1px; height: 10px; }
    .av-D .tick.t3 { top: -6px; left: 90%; width: 1px; height: 6px; }
    .av-D .tick.b1 { bottom: -6px; left: 10%; width: 1px; height: 6px; }
    .av-D .tick.b2 { bottom: -6px; left: 50%; width: 1px; height: 10px; }
    .av-D .tick.b3 { bottom: -6px; left: 90%; width: 1px; height: 6px; }

  </style>
</head>
<body>

  <!-- The artboards -->
  <template id="art-A">
    <div class="hero optA" data-screen-label="A · Brazo Robótico">
      <span class="opt-tag">A · BRAZO ROBÓTICO</span>

      <!-- robotic arm (FK: nested groups, rotation at each joint's local origin) -->
      <div class="robot-arm">
        <svg class="arm-svg" viewBox="0 0 1080 620" preserveAspectRatio="none">
          <!-- CEILING MOUNT (static) at the gap between text and avatar -->
          <rect class="arm-mount"   x="640" y="0"  width="140" height="22" rx="2"/>
          <rect class="arm-mount-2" x="676" y="22" width="68"  height="16" rx="2"/>
          <line class="arm-cable"   x1="710" y1="38" x2="710" y2="55"/>

          <!-- SHOULDER pivot at (710, 60). -->
          <g transform="translate(710 60)">
            <g>
              <animateTransform attributeName="transform"
                type="rotate" dur="9s" repeatCount="indefinite"
                values="100; 115; 100"
                keyTimes="0; 0.5; 1"
                calcMode="spline"
                keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>

              <!-- LINK 1 (upper arm): from (0,0) to (150,0) in local frame -->
              <rect class="arm-link" x="14" y="-10" width="136" height="20" rx="4"/>
              <line class="arm-link-inner" x1="22" y1="0" x2="144" y2="0"/>
              <!-- shoulder servo housing at (0,0) -->
              <circle class="servo-body" cx="0" cy="0" r="16"/>
              <circle class="servo-cap"  cx="0" cy="0" r="7"/>
              <circle class="servo-hole" cx="0" cy="0" r="2.5"/>

              <!-- ELBOW pivot at end of link 1 -->
              <g transform="translate(150 0)">
                <g>
                  <animateTransform attributeName="transform"
                    type="rotate" dur="9s" repeatCount="indefinite"
                    values="-30; -10; -30"
                    keyTimes="0; 0.5; 1"
                    calcMode="spline"
                    keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>

                  <!-- LINK 2 (forearm): from (0,0) to (115,0) -->
                  <rect class="arm-link" x="12" y="-9" width="103" height="18" rx="4"/>
                  <line class="arm-link-inner" x1="20" y1="0" x2="108" y2="0"/>
                  <!-- elbow servo -->
                  <circle class="servo-body" cx="0" cy="0" r="13"/>
                  <circle class="servo-cap"  cx="0" cy="0" r="5"/>
                  <circle class="servo-hole" cx="0" cy="0" r="2"/>

                  <!-- WRIST pivot at end of link 2 -->
                  <g transform="translate(115 0)">
                    <g>
                      <animateTransform attributeName="transform"
                        type="rotate" dur="9s" repeatCount="indefinite"
                        values="50; 25; 50"
                        keyTimes="0; 0.5; 1"
                        calcMode="spline"
                        keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>

                      <!-- LINK 3 (wrist segment) -->
                      <rect class="arm-link" x="10" y="-7" width="30" height="14" rx="3"/>
                      <!-- wrist servo -->
                      <circle class="servo-body" cx="0" cy="0" r="10"/>
                      <circle class="servo-cap"  cx="0" cy="0" r="4"/>

                      <!-- GRIPPER at end of link 3 -->
                      <g transform="translate(40 0)">
                        <rect class="arm-tool-2" x="0" y="-9" width="10" height="18" rx="2"/>
                        <rect class="arm-tool" x="10" y="-11" width="4" height="6"/>
                        <rect class="arm-tool" x="14" y="-12" width="14" height="3" rx="1"/>
                        <rect class="arm-tool" x="10" y="5"   width="4" height="6"/>
                        <rect class="arm-tool" x="14" y="9"   width="14" height="3" rx="1"/>
                        <circle class="arm-led" cx="5" cy="0" r="2"/>
                      </g>
                    </g>
                  </g>
                </g>
              </g>
            </g>
          </g>
        </svg>
      </div>

      <div class="hero-inner">
        <div class="hero-text">
          <p class="h-eyebrow">// Hola, soy</p>
          <h1 class="h-name">Adrián Morales<br>Alfonso</h1>
          <p class="h-title">Ingeniero Electrónico, Robótico y Mecatrónico</p>
          <p class="h-bio">Sistemas embebidos, automatización industrial, diseño de hardware y software de control.</p>
          <div class="h-actions">
            <button class="h-btn primary">Ver proyectos</button>
            <button class="h-btn outline">↓ Descargar CV</button>
          </div>
        </div>
        <div class="av-A">
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
          <div class="hex-border">
            <svg viewBox="-2 -2 204 204">
              <polygon points="100,0 200,50 200,150 100,200 0,150 0,50"/>
            </svg>
          </div>
          <div class="img" style="background-image:url('foto.jpg')"></div>
        </div>
      </div>
    </div>
  </template>

  <template id="art-B">
    <div class="hero optB" data-screen-label="B · PCB / Placa">
      <span class="opt-tag">B · PCB / PLACA</span>

      <div class="pcb-bg">
        <svg class="pcb-svg" viewBox="0 0 1080 620" preserveAspectRatio="none">
          <!-- traces (static) -->
          <path class="pcb-trace" d="M 50,80 L 200,80 L 200,180 L 380,180 L 380,80 L 520,80"/>
          <path class="pcb-trace" d="M 60,540 L 240,540 L 240,420 L 480,420 L 480,560 L 720,560"/>
          <path class="pcb-trace" d="M 880,120 L 980,120 L 980,260 L 820,260 L 820,400"/>
          <path class="pcb-trace" d="M 720,40 L 720,120 L 600,120 L 600,260"/>
          <path class="pcb-trace" d="M 40,260 L 140,260 L 140,360 L 240,360"/>
          <path class="pcb-trace" d="M 1040,440 L 940,440 L 940,520 L 800,520"/>
          <path class="pcb-trace" d="M 360,300 L 460,300 L 460,200 L 560,200"/>

          <!-- lit traces (animated) -->
          <path class="pcb-trace lit"   d="M 50,80 L 200,80 L 200,180 L 380,180 L 380,80 L 520,80"/>
          <path class="pcb-trace lit lit-2" d="M 60,540 L 240,540 L 240,420 L 480,420 L 480,560 L 720,560"/>
          <path class="pcb-trace lit lit-3" d="M 880,120 L 980,120 L 980,260 L 820,260 L 820,400"/>
          <path class="pcb-trace lit lit-4" d="M 720,40 L 720,120 L 600,120 L 600,260"/>

          <!-- pads -->
          <circle class="pcb-pad pulse" cx="200" cy="80"  r="4"/>
          <circle class="pcb-pad pulse" cx="380" cy="80"  r="4"/>
          <circle class="pcb-pad pulse" cx="240" cy="540" r="4"/>

  <script type="text/babel">
    const { useEffect, useRef } = React;

    function TplArtboard({ id }) {
      const ref = useRef(null);
      useEffect(() => {
        const tpl = document.getElementById(id);
        if (tpl && ref.current && !ref.current.firstChild) {
          ref.current.appendChild(tpl.content.cloneNode(true));
        }
      }, [id]);
      return <div ref={ref} style={{ width: '100%', height: '100%' }} />;
    }

    function App() {
      return (
        <DesignCanvas title="Hero · Opciones robóticas" subtitle="Elige fondo + tratamiento del avatar">
          <DCSection id="opciones" title="4 propuestas — temática robótica / ingeniería">
            <DCArtboard id="a" label="A · Brazo robótico" width={1080} height={620}>
              <TplArtboard id="art-A" />
            </DCArtboard>
            <DCArtboard id="b" label="B · PCB / Placa" width={1080} height={620}>
              <TplArtboard id="art-B" />
            </DCArtboard>
            <DCArtboard id="c" label="C · HUD / Blueprint" width={1080} height={620}>
              <TplArtboard id="art-C" />
            </DCArtboard>
            <DCArtboard id="d" label="D · Osciloscopio" width={1080} height={620}>
              <TplArtboard id="art-D" />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
